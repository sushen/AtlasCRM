<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/images/brand/atlas-logo.jpg">
  <title>Sign in · Atlas</title>
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css">
</head>
<body><main class="auth-page"><form id="login-form" class="auth-card">
  <div class="brand-mark"><img src="/images/brand/atlas-logo.jpg" alt="Atlas logo" width="72" height="72"></div><h1>Welcome to Atlas</h1>
  <p class="muted">Sign in to your private CRM workspace. Atlas Market is open to everyone without sign-in.</p>
  <button id="google-login" class="button" type="button">Continue with Google</button>
  <p class="muted small">Or use your existing email account</p>
  <label>Email<input id="email" type="email" required autocomplete="email"></label>
  <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
  <button class="button primary" type="submit">Sign in with email</button>
  <p id="login-error" class="error" role="alert" aria-live="polite"></p>
  <a href="/?catalog=1" class="muted small">Back to Atlas Market</a>
</form></main><script type="module" src="js/login.js"></script></body>
</html>
