name: Branch checks and isolated preview
on:
  push:
    branches: [master, 'codex/**', v2-development]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: branch-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run worker:check
      - run: node scripts/inventory-smoke.mjs
      - run: node scripts/worker-smoke.mjs --manual-payments
      - run: node scripts/build-preview.mjs
        env:
          PREVIEW_BASE_PATH: /AtlasCRM/
      - run: node scripts/check-preview.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-preview-${{ github.sha }}
          path: .firebase/preview-public
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/quick-add-lead'
        with:
          path: .firebase/preview-public
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/quick-add-lead'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated branch preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
